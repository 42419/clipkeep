name: Sync CNB Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v1.1.3'
        required: true
        type: string

  workflow_run:
    workflows: ['Android APK']
    types: [completed]

permissions:
  contents: read

jobs:
  sync:
    name: Sync release assets to CNB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    concurrency:
      group: sync-cnb-${{ github.event.workflow_run.head_branch || inputs.tag }}
      cancel-in-progress: false
    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_REPO: yunfeiii/clipkeep
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          BUILD_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${BUILD_TAG}"
          fi
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无效的 tag：${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check token
        run: |
          if [ -z "${CNB_TOKEN}" ]; then
            echo "::error::未配置 CNB_TOKEN（CNB 访问令牌，repo-release:rw）"
            exit 1
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern 'app-*-release.apk' \
            --pattern 'update.json' \
            --clobber
          gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json body \
            -q .body > dist/release-notes.md

      - name: Sync source tag to CNB
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          git push --force \
            "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}" \
            "refs/tags/${TAG}:refs/tags/${TAG}" || \
            echo "::warning::CNB tag 同步失败，继续尝试 Release 附件"

      - name: Create release and upload assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 scripts/sync_cnb_release.py \
            --repo "${CNB_REPO}" \
            --tag "${TAG}" \
            --notes-file dist/release-notes.md \
            --asset dist/app-arm64-v8a-release.apk \
            --asset dist/app-armeabi-v7a-release.apk \
            --asset dist/app-x86_64-release.apk \
            --asset dist/update.json
