name: Deploy Web

# 把 Flutter web 产物同步到服务器静态目录。
# 触发：推 v* tag（跟 App 发版一起），或手动执行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 与 android.yml 固定同一版本：同一个 tag 产出的 APK 与网页必须用同一套 SDK。
          flutter-version: '3.47.9'
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test test/unit_test.dart

      - name: build web
        run: flutter build web --release

      - name: pack
        run: tar -czf web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.tar.gz
          if-no-files-found: error

  deploy:
    name: upload to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web

      - name: load ssh key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: trust host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # 固定 host key（ssh-keyscan 等于无条件首信，中间人可以借此冒充服务器）。
          # 生成方式：ssh-keyscan -H <host>，把整段存到 secret DEPLOY_KNOWN_HOSTS。
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            echo "::warning::未配置 DEPLOY_KNOWN_HOSTS，回退到 ssh-keyscan（无法防御中间人）"
            ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: upload and swap
        run: |
          set -euo pipefail
          host="deploy@${{ secrets.DEPLOY_HOST }}"
          root="/opt/clipkeep-gateway"
          # 每次部署落一个独立目录，静态入口 www/current 是软链：切换只做一次
          # rename，访问者要么全拿旧版本、要么全拿新版本，不会读到半新半旧的页面。
          release="$root/releases/$(date -u +%Y%m%d-%H%M%S)"

          scp -q web.tar.gz "$host:/tmp/clipkeep-web.tar.gz"
          ssh "$host" "set -euo pipefail
            test -d '$root/releases' || { echo '服务器尚未迁移到 releases + www/current 布局，缺少 $root/releases' >&2; exit 1; }
            test -d '$root/www' || { echo '服务器尚未迁移到 releases + www/current 布局，缺少 $root/www' >&2; exit 1; }
            rm -rf /tmp/clipkeep-web && mkdir -p /tmp/clipkeep-web
            tar -xzf /tmp/clipkeep-web.tar.gz -C /tmp/clipkeep-web
            rm -rf '$release'
            mv /tmp/clipkeep-web '$release'
            # ln -sfn 是先 unlink 再 symlink，中间有一瞬入口不存在；
            # 「建临时软链 + mv -T」才是 rename，原子替换。
            ln -sfn '$release' '$root/www/current.tmp'
            mv -T '$root/www/current.tmp' '$root/www/current'
            rm -rf /tmp/clipkeep-web.tar.gz
            # 保留最近 5 个版本；当前版本一定在最新 5 个里，不会被清掉
            ls -1dt '$root'/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
            echo '--- 已切换到 ---'
            readlink -f '$root/www/current'"
