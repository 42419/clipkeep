name: Deploy Web

# 把 Flutter web 产物同步到服务器静态目录。
# 触发：推 v* tag（跟 App 发版一起），或手动执行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test test/unit_test.dart

      - name: build web
        run: flutter build web --release

      - name: pack
        run: tar -czf web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.tar.gz
          if-no-files-found: error

  deploy:
    name: upload to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web

      - name: load ssh key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: trust host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: upload and swap
        run: |
          set -euo pipefail
          host="deploy@${{ secrets.DEPLOY_HOST }}"
          target="/opt/clipkeep-gateway/static"

          scp -q web.tar.gz "$host:/tmp/clipkeep-web.tar.gz"
          ssh "$host" "set -euo pipefail
            test -d '$target' || { echo '目标目录不存在：$target' >&2; exit 1; }
            rm -rf /tmp/clipkeep-web && mkdir -p /tmp/clipkeep-web
            tar -xzf /tmp/clipkeep-web.tar.gz -C /tmp/clipkeep-web
            # 只清目标目录里的内容，不删目录本身，避免需要父目录写权限。
            find '$target' -mindepth 1 -delete
            cp -a /tmp/clipkeep-web/. '$target'/
            rm -rf /tmp/clipkeep-web /tmp/clipkeep-web.tar.gz
            echo '--- 已部署 ---'
            ls -1 '$target' | head -6"
