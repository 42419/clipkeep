name: Deploy Web

# 把 Flutter web 产物同步到服务器静态目录。
# 触发：推 v* tag（跟 App 发版一起），或手动执行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 与 android.yml 固定同一版本：同一个 tag 产出的 APK 与网页必须用同一套 SDK。
          flutter-version: '3.47.9'
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test test/unit_test.dart

      - name: build web
        run: flutter build web --release

      - name: pack
        run: tar -czf web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.tar.gz
          if-no-files-found: error

  deploy:
    name: upload to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web

      - name: load ssh key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: trust host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # 固定 host key（ssh-keyscan 等于无条件首信，中间人可以借此冒充服务器）。
          # 生成方式：ssh-keyscan -H <host>，把整段存到 secret DEPLOY_KNOWN_HOSTS。
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            echo "::warning::未配置 DEPLOY_KNOWN_HOSTS，回退到 ssh-keyscan（无法防御中间人）"
            ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: upload and swap
        run: |
          set -euo pipefail
          host="deploy@${{ secrets.DEPLOY_HOST }}"
          target="/opt/clipkeep-gateway/static"

          scp -q web.tar.gz "$host:/tmp/clipkeep-web.tar.gz"
          # rsync --delete 取代「先 find -delete 再 cp」：不再有整站清空到
          # 复制完成之间的空窗，cp 失败也不会留下半空的目录。
          # --delay-updates 把文件落盘推迟到传输末尾，窗口进一步缩小。
          ssh "$host" "set -euo pipefail
            test -d '$target' || { echo '目标目录不存在：$target' >&2; exit 1; }
            rm -rf /tmp/clipkeep-web && mkdir -p /tmp/clipkeep-web
            tar -xzf /tmp/clipkeep-web.tar.gz -C /tmp/clipkeep-web
            rsync -a --delete --delay-updates /tmp/clipkeep-web/ '$target'/
            rm -rf /tmp/clipkeep-web /tmp/clipkeep-web.tar.gz
            echo '--- 已部署 ---'
            ls -1 '$target' | head -6"
