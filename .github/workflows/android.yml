name: Android APK

on:
  # 只在手动触发或推送 v* tag 时构建；普通 push 到 main 不再出包。
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/clipkeep-release.jks

      - name: Write key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=clipkeep-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      # tag 触发时直接用 tag 名（vX.Y.Z）；手动触发时用 pubspec 的版本拼 vX.Y.Z。
      - name: Resolve release tag
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            version="$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml | head -n1)"
            if [ -z "$version" ]; then
              echo "pubspec.yaml 里找不到 version: x.y.z+n" >&2
              exit 1
            fi
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test/unit_test.dart

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: List built APKs
        run: ls -lh build/app/outputs/flutter-apk/*-release.apk

      - name: Generate update manifest
        run: |
          python3 scripts/gen_update_manifest.py \
            --release-tag ${{ steps.release.outputs.tag }} \
            --asset-base-url "https://cnb.cool/yunfeiii/clipkeep/-/releases/download/${{ steps.release.outputs.tag }}" \
            --asset-base-url "https://github.com/42419/clipkeep/releases/download/${{ steps.release.outputs.tag }}" \
            --output update.json \
            --notes-output release-notes.md

      - name: Publish APKs as individual release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: "ClipKeep ${{ steps.release.outputs.tag }}"
          # 直接使用该版本在 CHANGELOG 中的正文，由脚本生成。
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            update.json
